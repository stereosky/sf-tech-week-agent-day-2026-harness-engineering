[project]
name = "harness"
version = "0.1.0"
description = "Let's Build an Agent Harness: a minimal Python agent harness with Kafka as the session log."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.2,<3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
